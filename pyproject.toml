[project]
name = "atlas"
version = "0.1.0"
description = "Data processing for 800 to the Mile, a #30DayMapChallenge 2026 atlas of Chicago."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "matplotlib>=3.9",
    "geopandas>=1.2.0",
    "shapely>=2",
    "pyproj>=3.7.2",
    "osmnx>=2",
    "networkx>=3.6.1",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]
